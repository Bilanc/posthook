<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6e7681"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="399" rx="12" fill="#0d1117" stroke="#30363d"/>

  <!-- ============ left column: sources ============ -->
  <text x="40" y="40" font-size="11" fill="#8b949e" letter-spacing="1">AI AGENTS</text>

  <rect x="40" y="52" width="160" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="120" y="79" font-size="13" fill="#58a6ff" text-anchor="middle" font-weight="600">Claude Code</text>

  <rect x="40" y="108" width="160" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="120" y="135" font-size="13" fill="#58a6ff" text-anchor="middle" font-weight="600">Cursor</text>

  <rect x="40" y="164" width="160" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="120" y="191" font-size="13" fill="#58a6ff" text-anchor="middle" font-weight="600">Codex CLI</text>

  <text x="40" y="246" font-size="11" fill="#8b949e" letter-spacing="1">YOUR GIT</text>
  <rect x="40" y="256" width="160" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="120" y="283" font-size="12" fill="#d29922" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">git commit / clone</text>

  <!-- ============ middle: capture ============ -->
  <!-- spool -->
  <rect x="280" y="96" width="180" height="84" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="370" y="122" font-size="12.5" fill="#e6edf3" text-anchor="middle" font-weight="600">event spool</text>
  <text x="370" y="143" font-size="11" fill="#8b949e" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">~/.posthook/spool/</text>
  <text x="370" y="163" font-size="10.5" fill="#8b949e" text-anchor="middle">append-only · ms on hot path</text>

  <!-- git shadow -->
  <rect x="280" y="240" width="180" height="84" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="370" y="266" font-size="12.5" fill="#e6edf3" text-anchor="middle" font-weight="600">git shadow</text>
  <text x="370" y="286" font-size="10.5" fill="#8b949e" text-anchor="middle">PATH symlink in front of git</text>
  <text x="370" y="304" font-size="10.5" fill="#8b949e" text-anchor="middle">passthrough + capture</text>

  <!-- hook arrows -->
  <line x1="200" y1="74" x2="278" y2="116" stroke="#6e7681" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="200" y1="130" x2="278" y2="138" stroke="#6e7681" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="200" y1="186" x2="278" y2="160" stroke="#6e7681" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="238" y="118" font-size="10.5" fill="#8b949e">hooks</text>

  <!-- git arrow -->
  <line x1="200" y1="278" x2="278" y2="280" stroke="#6e7681" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- ============ database cylinder ============ -->
  <path d="M520,118 L520,222 A90,13 0 0 0 700,222 L700,118" fill="#161b22" stroke="#3fb950"/>
  <ellipse cx="610" cy="118" rx="90" ry="13" fill="#161b22" stroke="#3fb950"/>
  <text x="610" y="168" font-size="13" fill="#3fb950" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">posthook.db</text>
  <text x="610" y="189" font-size="10.5" fill="#8b949e" text-anchor="middle">SQLite · local by default</text>

  <!-- worker + commit arrows into db -->
  <line x1="460" y1="138" x2="518" y2="158" stroke="#6e7681" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="489" y="132" font-size="10.5" fill="#8b949e" text-anchor="middle">worker drains</text>
  <line x1="460" y1="282" x2="518" y2="210" stroke="#6e7681" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="497" y="262" font-size="10.5" fill="#8b949e" text-anchor="middle">commits</text>

  <!-- git notes -->
  <rect x="520" y="300" width="180" height="56" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="610" y="324" font-size="11.5" fill="#bc8cff" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">refs/notes/posthook</text>
  <text x="610" y="343" font-size="10" fill="#8b949e" text-anchor="middle">attribution travels with the repo</text>
  <line x1="460" y1="306" x2="518" y2="322" stroke="#6e7681" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- ============ right column: outputs ============ -->
  <text x="740" y="88" font-size="11" fill="#8b949e" letter-spacing="1">QUERY IT</text>

  <rect x="740" y="100" width="130" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="805" y="125" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">posthook blame</text>

  <rect x="740" y="156" width="130" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="805" y="181" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">posthook metrics</text>

  <rect x="740" y="212" width="130" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="805" y="237" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">posthook dash</text>

  <line x1="700" y1="150" x2="738" y2="124" stroke="#6e7681" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="700" y1="172" x2="738" y2="176" stroke="#6e7681" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="700" y1="194" x2="738" y2="228" stroke="#6e7681" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- footer -->
  <text x="450" y="382" font-size="11" fill="#8b949e" text-anchor="middle">no account · no network calls · one SQLite file you own</text>
</svg>
