<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6e7681"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="239" rx="12" fill="#0d1117" stroke="#30363d"/>

  <!-- step 1 -->
  <rect x="40" y="44" width="180" height="150" rx="10" fill="#161b22" stroke="#30363d"/>
  <circle cx="64" cy="68" r="11" fill="#58a6ff"/>
  <text x="64" y="72" font-size="11" fill="#0d1117" text-anchor="middle" font-weight="700">1</text>
  <text x="86" y="72" font-size="12" fill="#e6edf3" font-weight="600">AI edits a file</text>
  <text x="56" y="100" font-size="10.5" fill="#8b949e">The agent hook records</text>
  <text x="56" y="116" font-size="10.5" fill="#8b949e">the exact lines each</text>
  <text x="56" y="132" font-size="10.5" fill="#8b949e">edit produced.</text>
  <rect x="54" y="150" width="152" height="26" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="130" y="167" font-size="10.5" fill="#58a6ff" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">lines 12–48 · 9f2c41ab</text>

  <line x1="222" y1="120" x2="256" y2="120" stroke="#6e7681" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- step 2 -->
  <rect x="260" y="44" width="180" height="150" rx="10" fill="#161b22" stroke="#30363d"/>
  <circle cx="284" cy="68" r="11" fill="#d29922"/>
  <text x="284" y="72" font-size="11" fill="#0d1117" text-anchor="middle" font-weight="700">2</text>
  <text x="306" y="72" font-size="12" fill="#e6edf3" font-weight="600">You review + commit</text>
  <text x="276" y="100" font-size="10.5" fill="#8b949e">The git shadow captures</text>
  <text x="276" y="116" font-size="10.5" fill="#8b949e">the commit. Your workflow</text>
  <text x="276" y="132" font-size="10.5" fill="#8b949e">doesn't change.</text>
  <rect x="274" y="150" width="152" height="26" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="350" y="167" font-size="10.5" fill="#d29922" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">git commit</text>

  <line x1="442" y1="120" x2="476" y2="120" stroke="#6e7681" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- step 3 -->
  <rect x="480" y="44" width="180" height="150" rx="10" fill="#161b22" stroke="#30363d"/>
  <circle cx="504" cy="68" r="11" fill="#3fb950"/>
  <text x="504" y="72" font-size="11" fill="#0d1117" text-anchor="middle" font-weight="700">3</text>
  <text x="526" y="72" font-size="12" fill="#e6edf3" font-weight="600">Posthook links them</text>
  <text x="496" y="100" font-size="10.5" fill="#8b949e">Each touched file is</text>
  <text x="496" y="116" font-size="10.5" fill="#8b949e">credited to the session</text>
  <text x="496" y="132" font-size="10.5" fill="#8b949e">that last edited it.</text>
  <rect x="494" y="150" width="152" height="26" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="570" y="167" font-size="10.5" fill="#3fb950" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">commit_sessions</text>

  <line x1="662" y1="120" x2="696" y2="120" stroke="#6e7681" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- step 4 -->
  <rect x="700" y="44" width="180" height="150" rx="10" fill="#161b22" stroke="#30363d"/>
  <circle cx="724" cy="68" r="11" fill="#bc8cff"/>
  <text x="724" y="72" font-size="11" fill="#0d1117" text-anchor="middle" font-weight="700">4</text>
  <text x="746" y="72" font-size="12" fill="#e6edf3" font-weight="600">Travels with the repo</text>
  <text x="716" y="100" font-size="10.5" fill="#8b949e">A git note pushes to origin —</text>
  <text x="716" y="116" font-size="10.5" fill="#8b949e">teammates clone and</text>
  <text x="716" y="132" font-size="10.5" fill="#8b949e">blame just works.</text>
  <rect x="714" y="150" width="152" height="26" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="790" y="167" font-size="10.5" fill="#bc8cff" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">refs/notes/posthook</text>

  <text x="450" y="222" font-size="10.5" fill="#6e7681" text-anchor="middle">no prompt text and no code snippets ever leave your machine via notes — just line ranges, agent, model, session</text>
</svg>
